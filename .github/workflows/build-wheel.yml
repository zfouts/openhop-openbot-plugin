name: Build Wheel

# Every run tests and builds the wheel. Publishing:
#   push to main  -> rolling "edge" pre-release, recreated on the built commit
#   push v* tag   -> versioned release (version must match the tag)
#   manual run    -> attach to an existing tag, if one is given
# Pull requests only build and test.

on:
  push:
    branches: ["main"]
    tags: ["v*"]
  pull_request:
  workflow_dispatch:
    inputs:
      release_tag:
        description: "Existing tag to attach the wheel to (example: v0.1.2). Leave blank to only build."
        required: false
        type: string

permissions:
  contents: write

# One publish per ref at a time, so two quick pushes to main cannot race on
# deleting and recreating the edge release.
concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Install build tooling
        run: |
          python -m pip install --upgrade pip
          python -m pip install build

      - name: Install package with dev extras
        run: python -m pip install -e ".[dev]"

      - name: Run tests
        run: python -m pytest -q

      - name: Resolve release tag
        id: release
        shell: bash
        run: |
          tag=""
          kind=""
          if [[ "${{ github.event_name }}" == "push" && "${{ github.ref_type }}" == "tag" ]]; then
            tag="${GITHUB_REF_NAME}"; kind="version"
          elif [[ "${{ github.event_name }}" == "push" && "${{ github.ref }}" == "refs/heads/main" ]]; then
            tag="edge"; kind="edge"
          elif [[ "${{ github.event_name }}" == "workflow_dispatch" && -n "${{ inputs.release_tag }}" ]]; then
            tag="${{ inputs.release_tag }}"; kind="version"
          fi
          echo "tag=${tag}" >> "$GITHUB_OUTPUT"
          echo "kind=${kind}" >> "$GITHUB_OUTPUT"

      - name: Stamp edge version
        if: steps.release.outputs.kind == 'edge'
        shell: bash
        run: |
          base=$(python -c 'import tomllib; print(tomllib.load(open("pyproject.toml","rb"))["project"]["version"])')
          python scripts/set_version.py "${base}+edge.${GITHUB_RUN_NUMBER}"

      - name: Build wheel
        run: python -m build --wheel

      - name: Check version matches the tag
        if: steps.release.outputs.kind == 'version'
        shell: bash
        run: |
          tag="${{ steps.release.outputs.tag }}"
          want="${tag#v}"
          py_ver=$(python -c 'import tomllib; print(tomllib.load(open("pyproject.toml","rb"))["project"]["version"])')
          manifest_ver=$(python -c 'import json; print(json.load(open("openhop-plugin.json"))["version"])')
          echo "tag=${want} package=${py_ver} openhop-plugin.json=${manifest_ver}"
          if [[ "${py_ver}" != "${want}" || "${manifest_ver}" != "${want}" ]]; then
            echo "::error::version in pyproject.toml / openhop-plugin.json does not match tag ${tag}"
            exit 1
          fi
          ls dist/*-"${want}"-py3-none-any.whl

      - name: Write SHA-256 digest, catalogue entry and release notes
        id: digest
        shell: bash
        run: |
          wheel=$(ls dist/*.whl)
          name=$(basename "${wheel}")
          version=$(python -c 'import tomllib; print(tomllib.load(open("pyproject.toml","rb"))["project"]["version"])')
          sha=$(sha256sum "${wheel}" | awk '{print $1}')
          (cd dist && sha256sum "${name}" > "${name}.sha256")

          tag="${{ steps.release.outputs.tag }}"
          tag_args=()
          [[ -n "${tag}" ]] && tag_args=(--tag "${tag}")
          python scripts/catalogue_entry.py "${wheel}" "${tag_args[@]}" > dist/catalogue-entry.json

          url="${{ github.server_url }}/${{ github.repository }}/releases/download/${tag:-v${version}}/${name}"
          {
            if [[ "${{ steps.release.outputs.kind }}" == "edge" ]]; then
              echo "Rolling build of \`main\` at ${GITHUB_SHA::7}, replaced on every push."
              echo "Edge version: \`${version}\`. For a fixed version, use a \`v*\` release."
              echo
            fi
            echo "**Wheel:** \`${name}\` (version ${version})"
            echo "**SHA-256:** \`${sha}\`"
            echo
            echo "#### Install on an openHop Repeater (1.1.4 or newer)"
            echo
            echo "1. Download the wheel: ${url}"
            echo "2. Optionally check it: \`sha256sum ${name}\` should print the SHA-256 above."
            echo "3. On the repeater's **Plugins** page choose **Install** and upload the wheel."
            echo
            echo "Settings and data are kept across installs. See [docs/SETUP.md](${{ github.server_url }}/${{ github.repository }}/blob/${GITHUB_SHA}/docs/SETUP.md) for first-time setup."
            if [[ "${{ steps.release.outputs.kind }}" == "edge" ]]; then
              echo
              echo "Edge versions sort above the release they are built from, so installing this build replaces that release."
            fi
            echo
            echo "<details><summary>openHop plugin catalogue entry</summary>"
            echo
            echo '```json'
            cat dist/catalogue-entry.json
            echo '```'
            echo
            echo "</details>"
          } > release-notes.md
          cat release-notes.md >> "$GITHUB_STEP_SUMMARY"

      - name: Upload workflow artifact
        uses: actions/upload-artifact@v4
        with:
          name: openhop-openbot-plugin-wheel
          path: |
            dist/*.whl
            dist/*.sha256
            dist/catalogue-entry.json
          if-no-files-found: error

      - name: Publish rolling edge release
        if: steps.release.outputs.kind == 'edge'
        env:
          GH_TOKEN: ${{ github.token }}
        shell: bash
        run: |
          # Recreate rather than edit: the edge tag must move to this commit and
          # wheels from an older version number must not linger as assets.
          gh release delete edge --yes --cleanup-tag || true
          gh release create edge dist/*.whl dist/*.sha256 dist/catalogue-entry.json \
            --target "${GITHUB_SHA}" \
            --prerelease \
            --title "Edge build (main @ ${GITHUB_SHA::7})" \
            --notes-file release-notes.md

      - name: Attach wheel to versioned GitHub Release
        if: steps.release.outputs.kind == 'version'
        uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ steps.release.outputs.tag }}
          body_path: release-notes.md
          generate_release_notes: true
          files: |
            dist/*.whl
            dist/*.sha256
            dist/catalogue-entry.json
